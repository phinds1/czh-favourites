# Build czh-favorites with Maven on PRs and pushes to develop.
# GitHub runners don't have /opt/jdk-25, so this uses actions/setup-java (mvn, NOT ./mvn.sh)
# and the github-ci profile (HSQLDB for DB2 + public nexus only) so the build doesn't need the
# private nexus or the DB2 driver.
name: czh-favorites CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set timezone
        run: sudo timedatectl set-timezone Europe/Prague
      - uses: actions/checkout@v4
      - name: Install rpm
        run: sudo apt install -y rpm
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B install -Duser.timezone=Europe/Prague -Drpm=true -P github-ci
