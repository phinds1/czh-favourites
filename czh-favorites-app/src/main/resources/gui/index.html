<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>czh-favourites Vision 👀</title>
<link rel="icon" href="/gui/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5/dist/darkly/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="/gui/css/gui.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3 py-1 mb-0">
  <span class="navbar-brand mb-0 h6 text-uppercase font-monospace me-4"><i class="fa-solid fa-server me-2 text-success"></i>czh-favourites Vision 👀</span>
  <span id="gtms-clock" class="font-monospace text-success me-auto">--:--:-- LOCAL</span>
  <span id="error-msg" class="text-danger small me-3"></span>
  <div class="d-flex align-items-center gap-2">
    <span class="text-secondary small">Refresh:</span>
    <select id="refresh-select" class="form-select form-select-sm bg-black text-secondary border-secondary" style="width:auto">
      <option value="5">5s</option>
      <option value="10" selected>10s</option>
      <option value="30">30s</option>
      <option value="60">60s</option>
    </select>
    <span id="refresh-rate-display" class="badge bg-secondary font-monospace small">10s</span>
  </div>
</nav>
<div class="container-fluid px-3 pt-2">
  <ul class="nav nav-tabs mb-0" id="snap-tabs" role="tablist"></ul>
  <div class="tab-content p-3 bg-dark rounded-bottom" id="snap-content">
    <div id="snapshot-title" class="text-center text-secondary font-monospace mb-3" style="font-size:0.8rem;letter-spacing:0.15em"></div>
  </div>
  <div class="mt-2 d-flex align-items-center gap-2" id="cmd-bar">
    <span class="text-secondary font-monospace small">CMD&gt;</span>
    <input id="cmd-input" type="text" class="form-control form-control-sm bg-black border-secondary font-monospace text-success" style="max-width:320px" placeholder="ref N  |  tab name" autocomplete="off" spellcheck="false">
    <span class="text-secondary small">ref N=set refresh secs, tab=switch tab</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/gui/js/api.js"></script>
<script src="/gui/js/clock.js"></script>
<script src="/gui/js/chart.js"></script>
<script src="/gui/js/prom.js"></script>
<script src="/gui/js/app.js"></script>
<script src="/gui/js/snapshots/server.js"></script>
<script src="/gui/js/snapshots/operations.js"></script>
<script src="/gui/js/snapshots/player-lookup.js"></script>
</body>
</html>
