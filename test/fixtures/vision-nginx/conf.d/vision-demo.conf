# Vision demo nginx reverse proxy.
#
# Routes the czh-favorites GUI + API under a single context root per microservice so the browser
# makes only same-origin fetches (no CORS). nginx routes by the first URL segment and strips the
# prefix before proxying (trailing slash on proxy_pass). The backend keeps serving /gui/, /api/,
# /actuator/ at the servlet root; it learns its context root from the X-Vision-Base REQUEST header
# nginx sets (the backend rewrites the GUI HTML to rebase its absolute URLs under that root).
#
# Single-base model: the GUI's own context is /favorites-mgmt — every GUI call (/gui assets,
# /admin, /actuator) is served under it. So /favorites-mgmt/admin/ routes to the APP port and
# /favorites-mgmt/gui/ + /favorites-mgmt/actuator/ route to the MGMT port. The bare /favorites/
# context is kept for direct/cron API access (the GUI does not use it).
#
# Listener port is ${PORT} (8080 in tests — :80 needs root and clashes; :80 is the prod target).
# Backend app port 9290, management port 9291.

server {
    listen      ${PORT};
    server_name _;

    # --- Management context (/favorites-mgmt): the GUI's own context -------------------
    # /favorites-mgmt/admin/ -> APP port (business/admin API, reached through the GUI's context).
    # The trailing /admin/ on proxy_pass preserves the /admin segment:
    # /favorites-mgmt/admin/v1/player/x/draw-games/favorite-wagers/wagers -> /admin/v1/player/x/draw-games/favorite-wagers/wagers
    # (a bare proxy_pass http://127.0.0.1:9290/ would strip /favorites-mgmt/admin/ and leave
    # /v1/player/x/draw-games/favorite-wagers/wagers).
    location /favorites-mgmt/admin/ {
        proxy_pass         http://127.0.0.1:9290/admin/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Vision-Base "/favorites-mgmt";
    }

    # /favorites-mgmt/gui/ + /favorites-mgmt/actuator/ -> MGMT port (GUI assets + actuator).
    location /favorites-mgmt/ {
        proxy_pass         http://127.0.0.1:9291/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Vision-Base "/favorites-mgmt";
    }

    # --- App context (/favorites): direct/cron business API (GUI does not use this) ----
    location /favorites/ {
        proxy_pass         http://127.0.0.1:9290/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Vision-Base "/favorites";
    }
}
