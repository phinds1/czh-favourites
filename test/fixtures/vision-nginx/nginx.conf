worker_processes  1;
error_log  ${FIXTURE}/logs/error.log warn;
pid        ${FIXTURE}/run/nginx.pid;

events {
    worker_connections  256;
}

http {
    client_body_temp_path   ${FIXTURE}/temp/client_body;
    proxy_temp_path         ${FIXTURE}/temp/proxy;

    access_log  ${FIXTURE}/logs/access.log;

    include       ${FIXTURE}/conf.d/*.conf;
}
