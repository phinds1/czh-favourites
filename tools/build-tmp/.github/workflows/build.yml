name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        # github-ci profile: excludes IBM DB2 driver (not on Maven Central).
        # Tests run against H2/HSQLDB in-memory; DB2 connectivity is validated on-prem only.
        # maven-settings.xml mirrors everything to Maven Central, blocking the private nexus.
        run: mvn -B -s .github/maven-settings.xml -P 'github-ci,!db2' verify --no-transfer-progress
